<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#0f1117" />
		<!--
			Theme before first paint (docs/decisions.md §289, §290). Runs before
			any bundle, so a visitor who chose Light never sees a dark frame. It
			cannot import src/lib/theme.ts, so it repeats the key (cookie name and
			storage key alike), the three accepted values, the cookie-first order
			and the two theme-color values from there; src/lib/theme.test.ts
			executes this script to hold them equal. The shared cookie (every
			workspace of the platform) wins over this origin's localStorage.
			Either can throw (private modes, blocked site data): the page then
			follows the OS, exactly as if nothing had been chosen. The id is how
			the test finds it; keep it.
		-->
		<script id="theme-boot">
			(function () {
				var choice = 'system';
				var found = false;
				function valid(v) {
					return v === 'light' || v === 'dark' || v === 'system';
				}
				try {
					var parts = document.cookie.split(';');
					for (var i = 0; i < parts.length && !found; i++) {
						var eq = parts[i].indexOf('=');
						if (eq < 0 || parts[i].slice(0, eq).trim() !== 'feoh_theme') continue;
						var value = parts[i].slice(eq + 1).trim();
						if (valid(value)) {
							choice = value;
							found = true;
						}
					}
				} catch (e) {}
				if (!found) {
					try {
						var stored = window.localStorage.getItem('feoh_theme');
						if (valid(stored)) choice = stored;
					} catch (e) {}
				}
				document.documentElement.setAttribute('data-theme', choice);
				var light = choice === 'light';
				if (choice === 'system') {
					try {
						light = !!window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
					} catch (e) {}
				}
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute('content', light ? '#f4f5f8' : '#0f1117');
			})();
		</script>
		<!--
			Link-preview card. It lives here, not in svelte:head, because unfurl
			crawlers run no JavaScript. Platform-branded on every host, like the
			favicon. The image URL must be absolute, so PUBLIC_SITE_URL prefixes it
			(docs/environment.md). No title element here: routes set the title.
		-->
		<meta name="description" content="From invoice to payment in minutes, not days. AI-powered extraction, configurable approval workflows, and real ERP sync — in one place, with rebates on every card payment." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="FeohLedger" />
		<meta property="og:title" content="FeohLedger — Accounts payable, automated" />
		<meta property="og:description" content="From invoice to payment in minutes, not days. AI-powered extraction, configurable approval workflows, and real ERP sync — in one place, with rebates on every card payment." />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The FeohLedger mark, a gold feoh rune drawn as a split tally stick on navy, beside the words: FeohLedger. Accounts payable, automated. Invoice to payment, every bill matched." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta name="twitter:image:alt" content="The FeohLedger mark, a gold feoh rune drawn as a split tally stick on navy, beside the words: FeohLedger. Accounts payable, automated. Invoice to payment, every bill matched." />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
