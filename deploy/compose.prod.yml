# Production compose stack for the minimal single-VM deployment.
# See docs/minimal-deployment.md for the full plan and deploy/README.md for
# day-to-day operations. Interpolation values (${...}) come from deploy/.env,
# which deploy.sh (via decrypt-env.sh) decrypts from the sops-encrypted
# deploy/prod.sops.yaml — never create deploy/.env by hand and never commit it.
#
# Postgres and Redis publish NO host ports: they are reachable only on the
# compose network. S3 is real AWS S3 (no MinIO here — FEOH_S3_ENDPOINT_URL and
# the static keys are set empty in the sops env, so boto3 uses the instance
# profile).
#
# Two database modes (docs/minimal-deployment.md § Database), chosen by whether
# the sops env sets FEOH_DATABASE_URL — decided in ONE place, deploy/lib.sh,
# which every deploy script sources:
#   - external (the documented path: Amazon RDS) — FEOH_DATABASE_URL set,
#     PGSSLMODE verify-full; the `postgres` service below never starts.
#   - local (the cheaper alternative) — FEOH_DATABASE_URL unset; the `postgres`
#     service runs under the `localdb` profile, which lib.sh activates.
# Ad-hoc compose commands go through deploy/compose.sh, which applies the same
# choice — a bare `docker compose -f compose.prod.yml up` would leave a
# local-mode stack without its database.

name: feoh-prod

# Cap container logs — Docker's json-file driver is unbounded by default, and
# on a 30 GB single-VM disk the uvicorn + Caddy access logs would eventually
# fill it and take Postgres down with it. 10 MB × 5 files × 4 services ≈
# 200 MB worst case.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    # Same image as dev: Postgres 16 + pgvector (RAG extraction priors).
    # Every image in this file is pinned to a release tag AND its index digest,
    # so a redeploy can never pick up an upstream retag, and bumps arrive as
    # Dependabot PRs (the `docker-compose` entry in .github/dependabot.yml
    # reads this file). Postgres and Redis stay on the SAME refs as
    # backend/docker-compose.yml, which is what CI starts — dev, CI and
    # production run one image, and backend/tests/test_container_supply_chain.py
    # fails if a bump moves one file without the other.
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    # Local-database mode only: deploy/lib.sh activates `localdb` when the sops
    # env leaves FEOH_DATABASE_URL unset. With an external database (RDS) this
    # container never starts — no wasted RAM, no second database to confuse.
    profiles: [localdb]
    restart: unless-stopped
    logging: *default-logging
    # Docker's default /dev/shm is 64 MB; Postgres parallel workers and
    # pgvector index builds allocate dynamic shared memory there and fail
    # with "could not resize shared memory segment" under the default.
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      # NOT `:?`: compose interpolates every service, profiled-out ones too, so
      # a required-variable guard here would refuse the whole file in RDS mode,
      # where POSTGRES_PASSWORD is legitimately empty. decrypt-env.sh owns the
      # check instead — required in local mode, before any deploy step runs.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: feohledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the socket: on a fresh volume the image's entrypoint runs
      # a temporary socket-only server for initdb, which `pg_isready` over the
      # socket reports ready — the container went "healthy" and then shut that
      # server down under the first client (deploy.sh's migrations on a first
      # deploy: "the database system is shutting down"). The real server is
      # the only one listening on TCP.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    logging: *default-logging
    # AOF persistence: losing the blocklist would resurrect logged-out JWTs
    # until natural expiry, and rate-limit / MFA state would reset.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../backend
    restart: unless-stopped
    logging: *default-logging
    # All FEOH_* config + secrets come from the decrypted sops env.
    env_file: .env
    environment:
      # Defaults derive from the local containers so the DB password lives in
      # exactly one sops entry (keep POSTGRES_PASSWORD URL-safe, e.g.
      # `openssl rand -hex 24`). These are the OVERRIDE SEAMS: setting
      # FEOH_DATABASE_URL / FEOH_REDIS_URL in the sops env replaces them — the
      # RDS deployment sets FEOH_DATABASE_URL (which also switches the stack to
      # external-database mode, see the header), ElastiCache would set the
      # other. No compose edit either way.
      FEOH_DATABASE_URL: ${FEOH_DATABASE_URL:-postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/feohledger}
      FEOH_REDIS_URL: ${FEOH_REDIS_URL:-redis://redis:6379}
      # Database TLS, read by asyncpg for every connection the app opens —
      # engines, tenant engines, the raw CREATE/DROP DATABASE connection — as
      # none of them passes an `ssl` argument (docs/minimal-deployment.md
      # § Database TLS). `prefer` is asyncpg's own default and today's
      # behaviour against the local container, which serves no TLS. For RDS
      # the sops env sets `verify-full` (decrypt-env.sh refuses anything
      # weaker), checked against PGSSLROOTCERT, the RDS CA bundle the image
      # carries (backend/Dockerfile).
      PGSSLMODE: ${PGSSLMODE:-prefer}
      # boto3 (S3 / SES) resolves credentials from the EC2 instance profile;
      # the region must be explicit. NOTE: IMDSv2 needs hop limit 2 for
      # containers — see deploy/README.md.
      AWS_DEFAULT_REGION: ${AWS_REGION:?set in deploy/.env (via sops)}
      # Caddy is the only ingress and lives on the pinned compose subnet
      # (see `networks:` below). Trusting it lets the per-IP rate limits and
      # the login/signup audit rows key on the real client from
      # X-Forwarded-For — untrusted, every user collapses into Caddy's
      # container IP and the signup/login caps throttle everyone at once.
      # Same override seam as the URLs above (e.g. an external LB in front).
      FEOH_TRUSTED_PROXY_CIDRS: ${FEOH_TRUSTED_PROXY_CIDRS:-172.28.0.0/16}
    depends_on:
      # `required: false` (compose >= 2.20; bootstrap-vm.sh pins 2.32.4): in
      # local mode the `localdb` profile is active and the api waits for a
      # healthy database exactly as before; with an external database the
      # service is not in the project and the dependency is skipped.
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
    # Lets `deploy.sh` roll out with `up -d --wait`: the deploy fails loudly
    # if the API never comes healthy instead of leaving a silently-broken box.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Entrypoint is the image CMD: uvicorn app.main:app (the production
    # entrypoint — main.py with dotenv is local-dev only).

  caddy:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set in deploy/.env (via sops)}
      API_DOMAIN: ${API_DOMAIN:?set in deploy/.env (via sops)}
      ACME_EMAIL: ${ACME_EMAIL:?set in deploy/.env (via sops)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Per-VM tenant host list (gitignored; deploy.sh seeds it from the
      # committed .example). Add a block per tenant subdomain + reload.
      - ./tenants.caddy:/etc/caddy/tenants.caddy:ro
      # Static SPA built by deploy.sh (pnpm -C frontend build).
      - ../frontend/build:/srv:ro
      # Certificates + ACME account state — must persist across restarts or
      # Let's Encrypt rate limits will bite.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # One-shot Postgres client tools (pg_dump / pg_dumpall / psql / pg_restore)
  # for an EXTERNAL database: backup.sh and restore.sh run it as
  # `docker compose run --rm -T pgtools <tool> …` in RDS mode. The same pinned
  # image as `postgres`, so the tools match the server major (16). Local mode
  # never uses it — those scripts `exec` into the
  # running `postgres` container as before. The `tools` profile keeps `up`
  # from starting it; naming it in `run` activates it.
  #
  # Connection: lib.sh passes PGHOST / PGPORT / PGUSER (not secret) with
  # `run -e NAME=value`, and PGPASSWORD with a bare `run -e PGPASSWORD`, so the
  # password travels through the environment and never appears in any
  # process's argv. TLS: the same PGSSLMODE the api gets, verified against the
  # RDS CA bundle mounted from the repo (the file backend/Dockerfile bakes in).
  pgtools:
    # Spelled out, not a YAML anchor: Dependabot matches `image: <ref>` lines,
    # and an anchor between the key and the ref would hide the postgres line
    # from it. It bumps both declarations together; tests/test_deploy_db_mode.py
    # fails if they ever differ.
    image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    profiles: [tools]
    logging: *default-logging
    environment:
      PGSSLMODE: ${PGSSLMODE:-prefer}
      PGSSLROOTCERT: /certs/rds-global-bundle.pem
    volumes:
      - ../backend/certs/rds-global-bundle.pem:/certs/rds-global-bundle.pem:ro

  # The one-shot production frontend build: deploy.sh runs it as
  # `docker compose run --rm frontend-build`, and the `build` profile keeps
  # `up` from ever starting it. It is a service rather than a `docker run` in
  # deploy.sh so that its Node image sits where the `docker-compose` Dependabot
  # entry reads it — a ref in a shell variable has no reader and rots
  # (docs/decisions.md §203). The Node MAJOR moves only with CI's `setup-node`
  # (Dependabot ignores node majors, and backend/tests/
  # test_container_supply_chain.py fails when the two part): production must
  # build on the runtime CI tests. No Node or pnpm is installed on the VM.
  frontend-build:
    image: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    profiles: [build]
    working_dir: /repo/frontend
    volumes:
      - ..:/repo
      - pnpm-store:/pnpm-store
    # deploy.sh passes PNPM_SPEC (read from frontend/package.json's
    # `packageManager`), PUBLIC_API_URL and PUBLIC_SITE_URL with `run -e`; `$$`
    # leaves the expansion to the container's shell.
    environment:
      npm_config_store_dir: /pnpm-store
    command:
      - sh
      - -ec
      - 'npm i -g "$$PNPM_SPEC" >/dev/null 2>&1 && pnpm install --frozen-lockfile && pnpm build'

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  # Caches the pnpm store across deploys so a rebuild does not re-download the
  # world. Compose-managed (`feoh-prod_pnpm-store`), not the
  # `feoh-prod-pnpm-store` deploy.sh's old `docker run -v` made: adopting that
  # one by name draws a "not created by Docker Compose" warning on every deploy.
  # A cache costs one cold build to replace; deploy/README.md says how to drop
  # the old volume.
  pnpm-store:

networks:
  # Pinned so FEOH_TRUSTED_PROXY_CIDRS (api service above) can name the
  # proxy's network deterministically — Docker otherwise assigns a random
  # subnet from its address pool per host.
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
