name: feohledger_mobile
description: FeohLedger mobile app — invoice approval, payment tracking, dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^4.0.5
  camera: ^0.12.1
  cupertino_icons: ^2.0.0
  file_picker: ^12.0.0-beta.7
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.3.0
  http_parser: ^4.1.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  pull_to_refresh_flutter3: ^2.0.2
  share_plus: ^13.3.1
  sqflite: ^2.4.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.5

flutter:
  generate: true
  uses-material-design: true
  # The in-app brand mark, rendered by assets/gen-icons.sh (1x, 2.0x, 3.0x).
  assets:
    - assets/brand/
