# osv-scanner configuration. supply-chain-scan.yml passes it with --config,
# so it applies to every lockfile the scan reads; Scorecard's Vulnerabilities
# check reads the same file. Each entry is an advisory with no patched
# release, scoped to one advisory ID and its aliases (a new advisory against
# the same package still reports) and re-reviewed by `ignoreUntil`, after
# which the alert returns. Rationale: docs/decisions.md §350.

[[IgnoredVulns]]
# CVE-2026-93753: deepmerge <= 4.3.1 mergeObject() prototype poisoning.
# Patched locally (frontend/patches/deepmerge@4.3.1.patch, package.json
# pnpm.patchedDependencies); frontend/src/lib/deepmergePatch.security.test.ts
# fails if the patch stops applying. pnpm audit carries the same exception in
# package.json pnpm.auditConfig.ignoreGhsas. Rationale: docs/decisions.md §352.
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-02-10
reason = """
No fixed release: 4.3.1 is deepmerge's latest and the advisory lists no \
patched version. Its only dependent in frontend/pnpm-lock.yaml is \
@sveltejs/vite-plugin-svelte, already at its latest 7.3.1, which declares \
deepmerge ^4.3.1 and uses it at build time to merge the plugin's options with \
svelte.config.js. The repo patches 4.3.1 to refuse a __proto__ key, guarded by \
deepmergePatch.security.test.ts. Drop this, the patch and the pnpm audit \
ignore once deepmerge publishes a patched release or vite-plugin-svelte drops \
it.\
"""
