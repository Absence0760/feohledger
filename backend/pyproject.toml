[project]
name = "backend"
version = "0.1.0"
description = "FeohLedger API — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1,<1",
    # Pinned explicitly (transitive via fastapi) to hold the floor above
    # CVE-2026-54283 / CVE-2026-54282: request.form() limits silently ignored
    # for application/x-www-form-urlencoded (DoS), both fixed in 1.3.1.
    "starlette>=1.6.0,<2",
    "uvicorn[standard]>=0.53.0,<1",
    "sqlalchemy[asyncio]>=2.0.54,<3",
    "asyncpg>=0.31.0,<1",
    "alembic>=1.20.0,<2",
    "pydantic>=2.13.5,<3",
    # >=2.14.2 fixes GHSA-4xgf-cpjx-pc3j (NestedSecretsSettingsSource follows
    # symlinks outside secrets_dir).
    "pydantic-settings>=2.15.0,<3",
    "python-multipart>=0.0.32,<1",
    "boto3>=1.43.98,<2",
    # Password hashing, called directly — there is no passlib here any more.
    # passlib 1.7.4 (its last release, 2020) held this floor at 4.0.1 for two
    # years: it reads `bcrypt.__about__.__version__`, deleted in bcrypt 5.0, and
    # its backend probe hashes a >72-byte secret, which bcrypt raises on from
    # 4.1. Both fire at import, so PR #392's bump to 5.0 took out every module
    # that touches `app.utils.passwords` — 29 collection errors across all four
    # shards. `app/utils/passwords.py` now implements the `bcrypt_sha256`
    # scheme itself (same digest, byte for byte; `tests/test_bcrypt_sha256_compat.py`
    # pins it against hashes passlib produced), so the floor follows upstream
    # again. See `docs/decisions.md` §151.
    "bcrypt>=5.0.0,<6",
    "redis>=8.1.0,<9",
    "python-jose[cryptography]>=3.5.0,<4",
    "httpx>=0.28.1,<1",
    "PyMuPDF>=1.28.2,<2",
    "pgvector>=0.5.0,<1",
    # OIDC ID-token signature + claims verification in services/sso.py.
    # (Successor to authlib.jose, which deprecated that module in favour of
    # joserfc; we use joserfc directly so there's no authlib dependency.)
    "joserfc>=1.7.5,<2",
    # SAML 2.0 Service-Provider: assertion XML-DSig verification (services/
    # auth_saml.py). python3-saml verifies in-process via python-xmlsec (no
    # xmlsec1 binary shell-out), keeping the slim-image / local-first story
    # intact. xmlsec + lxml are transitive but pinned explicitly so they land
    # in the hash-locks; both ship cp314 binary wheels (no -devel headers
    # needed). Floor >=1.16 carries the modern xmlsec node-binding XSW fixes.
    "python3-saml>=1.16,<2",
    "xmlsec>=1.3.17,<2",
    "lxml>=6.1.3,<7",
    "pyotp>=2.10.0,<3",
    "qrcode[pil]>=8.2,<9",
    # WebAuthn / passkeys — the second MFA factor alongside pyotp's TOTP.
    # Wraps the FIDO2 register/authenticate ceremonies (services/webauthn.py).
    "webauthn>=3.0.0,<4",
    "reportlab>=5.0.1,<6",
    # Loaded by the local-dev entrypoint (main.py) to read .env.development /
    # .env. Already pulled in transitively by uvicorn[standard]; declared here
    # because main.py imports it directly. Never imported on Lambda/prod paths.
    "python-dotenv>=1.2.3,<2",
    # AWS Lambda Runtime Interface Client. The single container image is
    # dual-use: ECS runs it via the uvicorn CMD, and the async-worker Lambdas
    # (services/{extraction,erp,audit}_lambda.py) run the SAME image as a
    # container Lambda — each function's ImageConfig overrides the entrypoint
    # to `python -m awslambdaric` + its handler. Bundling the RIC here is what
    # lets aws-deploy.yml's `lambdas` job point every worker at the one image
    # the backend job built (one build, many runtimes). Ships a cp314
    # manylinux wheel, so no compiler is added to the slim image. The RIC is
    # imported only by the Lambda runtime, never on the ECS/API path. See
    # docs/production-deployment.md → Lambda workers.
    "awslambdaric>=4.0.4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    # CI shards the backend suite across parallel jobs (ci.yml → backend-test
    # matrix). pytest-split's `--splits N --group G` partitions the suite by
    # the committed `.test_durations` baseline so each shard gets a roughly
    # equal wall-clock slice. Regenerate the baseline with
    # `pytest --store-durations` after large test-surface changes.
    "pytest-split>=0.11.0,<1",
    # A hung test previously produced zero diagnostic output: CI's only backstop
    # was `timeout-minutes: 40` on the whole shard, which just reaps the runner
    # with no traceback (docs/followups.md — "a genuinely hung backend test
    # produces zero diagnostic output"). `timeout` + `timeout_method` in
    # `[tool.pytest.ini_options]` below are this plugin's per-test ceiling; see
    # that section, and `backend/CLAUDE.md` § CI test sharding, for the ceiling
    # arithmetic and why `thread` mode is right for this asyncio suite.
    "pytest-timeout>=2.4.0,<3",
    "httpx>=0.28.1,<1",
    # Tight pin: ruff occasionally adds new lint rules in patch
    # releases (0.15 added the I001 check that bit us once). Pinning
    # to a single minor keeps CI's `pip install` from quietly picking
    # up stricter rules than the local venv runs. Bump intentionally
    # via dependabot or a manual upgrade pass.
    "ruff>=0.16.8,<0.17",
]
# Optional: auto-rotation of scanned invoice pages via Tesseract OSD.
# Install with `pip install -e ".[ocr]"` and ensure the `tesseract` binary
# (plus the `osd` traineddata file) is on PATH. Missing → auto-rotate
# degrades to a silent no-op in `services.image_preprocess`.
ocr = [
    "pytesseract>=0.3.13,<1",
    "Pillow>=12.3.0,<13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
# ruff 0.16 began formatting Python code blocks embedded in Markdown, which
# put 11 docs (including CLAUDE.md) permanently red under
# `ruff format --check .`. This config lints and formats Python *source*; the
# docs' snippets are illustrative rather than runnable — elided bodies (`...`),
# and comment alignment used for emphasis (`db.add(card)   # WRONG — pending`)
# that the formatter collapses. Prose stays hand-formatted.
exclude = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# No `filterwarnings` entries. The only one this project ever needed suppressed
# passlib's import of the deprecated stdlib `crypt` module; dropping passlib
# (`docs/decisions.md` §151) retired it. Keep the list absent rather than empty
# so a future entry has to justify itself.

# --- pytest-timeout: a per-test ceiling, so a genuinely hung test dies with
# diagnostics instead of riding CI's 40-minute shard timeout to a silent
# "Terminate orphan process" (docs/followups.md). This is a debugging aid, not
# a performance gate — it must never fire on a slow-but-legitimate test.
#
# Ceiling arithmetic (backend/.test_durations, 8,143 recorded tests):
#   - Slowest recorded test: 14.65s
#     (test_rename_databases_script.py::test_apply_renames_tenants_control_and_rows_but_not_lookalikes)
#   - The recorded figures understate real CI wall time by ~2.2x (sum of all
#     recorded durations is 1,628s; the suite actually runs ~60min/8 shards on
#     CI — docs/followups.md "the pytest-split baseline is stale" entry).
#     14.65s * 2.2 ≈ 32.2s is that test's realistic CI-equivalent worst case.
#   - `timeout = 600` (10 minutes) is ~18.6x that CI-adjusted figure (~41x the
#     raw recorded figure) — well over the 10x floor, so a real hang is caught
#     with minutes to spare under the shard's 40-minute cap, while no
#     legitimate test (even one 3x-degraded on a bad runner, per `backend/
#     CLAUDE.md` § CI test sharding) comes remotely close to tripping it.
timeout = 600
# "signal" (SIGALRM in the main thread) only interrupts at Python bytecode
# boundaries and can't reach a genuinely stuck C-level wait — a blocked
# asyncpg/libpq call, a wedged socket read — which is exactly the shape a real
# hang takes in an `asyncio_mode = "auto"` suite over Postgres/Redis/MinIO. It
# can also misbehave raising into asyncio's own machinery mid-await. "thread"
# runs a separate watchdog thread that doesn't depend on interrupting whatever
# the main thread is blocked on: at the ceiling it dumps every thread's stack
# (via faulthandler) to stderr, then hard-kills the process. That sacrifices
# "just fail the one test and keep going" — the whole run dies — but that is
# the right trade here: a genuinely hung test needs the process to die anyway
# (CI's 40-minute cap already does that), and this is what makes the death
# carry a traceback instead of "Terminate orphan process" and nothing else.
timeout_method = "thread"
# Built into pytest itself (no extra dependency): dumps every thread's stack
# to stderr once a test has run this long. Set below `timeout` so this dump —
# and its flush to stderr — completes before pytest-timeout's own "thread"-mode
# dump-and-kill fires at 600s; without that gap the process could exit before
# this one finished writing.
faulthandler_timeout = 540
