version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # `patterns` was NOT the operative difference — that hypothesis is
      # refuted. It was added on 2026-09-05; the next scheduled run
      # (Monday 2026-09-07) still delivered #379 and #381 on their own
      # `dependabot/pip/backend/<dep>-gte-…` branches, and the npm group
      # below groups fine with no `patterns` at all.
      #
      # What actually differs is `update-types` on an ecosystem where
      # Dependabot can see no lockfile. Our locks are `requirements.lock` /
      # `requirements-dev.lock`, and pip-compile support only recognises a
      # lockfile whose name ends in `.txt` and matches an `.in` basename
      # (see the fake-erp note below, which is why THAT group works). So for
      # /backend Dependabot reads only pyproject's ranges, resolves no
      # concrete version, computes no semver update type, and every member
      # falls out of a group filtered by one. The branch names say so:
      # `boto3-gte-1.43.88-and-lt-2` is a requirement-range edit, not a
      # version bump.
      #
      # So the group is now shaped exactly like the two that demonstrably do
      # group (`actions`, `fake-erp`): `patterns` alone, no `update-types`.
      # The cost is that a major can now ride in the same PR as patches;
      # that is the lesser evil while every bump arrives alone, because the
      # backend locks are regenerated by hand and one ungrouped bump costs a
      # whole recompile.
      #
      # CONFIRMED 2026-09-14. The scheduled Monday run delivered the backend
      # bumps grouped on one `backend-minor-patch` branch — #404 (2 updates),
      # superseded by #410 (3 updates, merged). Dropping `update-types` was
      # the fix; no further change is needed here, and the lead this comment
      # used to hold in reserve (renaming the locks to the `.in`/`.txt` pair
      # pip-compile support recognises) is not needed.
      backend-minor-patch:
        patterns:
          - "*"

    # No `ignore:` list. The one entry it used to carry held bcrypt below 4.1,
    # because passlib 1.7.4 could not import against it; dropping passlib
    # (`docs/decisions.md` §151) lifted the pyproject pin to `>=5.0.0,<6` and
    # this ignore with it — bcrypt updates are wanted again.

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Both Dockerfiles pin their base image by digest so Scorecard's
  # PinnedDependencies check passes and a re-tagged python:3.14-slim can't
  # change what we build. A digest pin only stays safe if something bumps
  # it — without this entry the fixture image would silently rot on an
  # ever-older, ever-more-CVE-laden base.
  - package-ecosystem: docker
    directory: /tools/fake-erp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Every `image:` in the two compose files is pinned `repo:tag@sha256:…`, and
  # the `docker` entries above do NOT read compose files — they read
  # Dockerfiles only. `docker-compose` is its own ecosystem; its fetcher matches
  # `(docker-)?compose(-x)?(.x)?.ya?ml`, so it finds both
  # `backend/docker-compose.yml` and `deploy/compose.prod.yml`, and its updater
  # rewrites the tag and the digest together.
  #
  # No ecosystem reads a workflow's `services:` images or a ref in a shell
  # script (`github-actions` reads only `uses:`), so nothing else writes one:
  # CI's pgvector / redis / minio come from backend/docker-compose.yml through
  # the `compose-images` job in ci.yml and sso-e2e.yml, and the production
  # frontend build's Node image is the `frontend-build` service in
  # deploy/compose.prod.yml (docs/decisions.md §203). So a PR from this entry
  # is tested by its own CI run on the images it bumps, which is what makes
  # `dependabot-auto-merge.yml` merging a green one safe.
  # backend/tests/test_container_supply_chain.py fails if a ref is restated.
  #
  # Majors are ignored for the stateful stores, for LocalStack and for Node. A
  # Postgres or Redis major is a data-directory / persistence upgrade to plan,
  # not a dependency bump to merge — pgvector's `-pg16` tag suffix already
  # keeps it on 16, and this keeps `postgres` (Authentik's DB) and `redis`
  # there too. LocalStack's next "major" is the calendar-versioned 2026.x line,
  # which refuses to start without a LOCALSTACK_AUTH_TOKEN; local-first (guard
  # rail 7) and CI's service-e2e job both run it with no account, so 3.x is
  # held. The Node major moves with every `setup-node` in the workflows at once
  # (frontend/CLAUDE.md § The Node floor) — a lone image major would build
  # production on a runtime CI never ran, and the supply-chain test fails it.
  - package-ecosystem: docker-compose
    directories:
      - /backend
      - /deploy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compose-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
      - dependency-name: localstack/localstack
        update-types: ["version-update:semver-major"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # fake-erp's Python deps. Dependabot's pip-compile support pairs
  # requirements.in with requirements.txt (it only treats a file as a
  # pip-compile lockfile when the name ends in `.txt` and matches the
  # `.in` basename) and re-applies --generate-hashes because the output
  # already carries --hash= lines. Grouped because a fixture doesn't
  # warrant one PR per transitive bump.
  - package-ecosystem: pip
    directory: /tools/fake-erp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      fake-erp:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        update-types:
          - minor
          - patch
