name: Web bundle budget

# Hard ceilings on the shipped frontend bundle. The app is adapter-static and
# served from S3 behind CloudFront, so every kilobyte here is downloaded by
# every user on a cold visit — and nothing else in CI notices weight. A PR that pushes
# either metric over its budget fails, so a reviewer has to acknowledge the
# increase instead of it landing unremarked.
#
# This is a ratchet, not a wall: bumping a ceiling is a legitimate outcome when
# the right answer is "ship the feature". The rule is that the bump is
# deliberate and justified IN THIS FILE (see the log under MAX_TOTAL_KB), never
# a casual edit because the job went red.
#
# How it blocks a merge: this is a reusable workflow, called by the
# `bundle-budget` job in ci.yml, which the `CI gate` job (the single required
# check on `main`) needs. It used to be a standalone workflow with its own
# `pull_request` trigger, outside the gate — so a red budget never blocked
# anything, and PR #611 merged over it and left `main` failing. Making it a
# separately required check would not work either: it is path-scoped, and a
# required check that never reports on an unrelated PR hangs that PR forever.
# The path scoping now lives in ci.yml's `changes` job (the `bundle` filter):
# an unrelated PR SKIPS the caller job, which the gate counts as a pass, while
# a failure or cancel fails the gate. Do not add a trigger here — ci.yml runs
# it on every PR and push to main that touches the frontend.

on:
  workflow_call:

permissions:
  contents: read

env:
  # Measured 2026-08-06 at the first run of this guard: 747 KB total gzipped
  # across 182 JS+CSS files, largest single chunk 43 KB. Ceilings set with
  # ~14% headroom on the total and deliberately generous headroom on the
  # largest chunk.
  #
  # Why the largest-chunk ceiling is far above the current max: its job is to
  # catch ONE heavyweight dependency landing in ONE chunk (a charting library,
  # a PDF renderer, a second date library), which is the failure mode that
  # actually hurts. This app hand-rolls its charts as CSS bars precisely to
  # avoid that, so the current 43 KB max has room to grow naturally before the
  # gate has anything to say.
  #
  # WHAT THE TOTAL MEASURES (since 2026-10-21): what one visitor downloads to
  # open the app's most expensive page — the app shell (SvelteKit's boot
  # entries, its client runtime and the root layout, statically closed), plus
  # the heaviest single route's own static imports beyond the shell, plus the
  # largest file of each lazy locale catalogue kind (the main catalogue and
  # each slice — help, settings, portal, … — read off the locales/
  # subdirectories; a visitor fetches at most one of each). It is computed from
  # the Vite manifest's import graph and SvelteKit's route dictionary by
  # scripts/measure_web_bundle.mjs, whose header states the rule for lazy
  # imports. Code-splitting a dependency off the shell or the heaviest route
  # therefore DOES lower this number now; a lazy chunk counts on the route that
  # imports it statically. The every-chunk sum (the gated metric until this
  # date) and the shipped sum are still reported in the job summary, ungated.
  # Every figure is summed in bytes and rounded once.
  #
  # Entries before 2026-10-21 describe the every-chunk metric; their numbers
  # are not comparable with the ceiling below.
  #
  # ── Ceiling change log — append a dated entry with the measurement + reason ──
  # 2026-08-06 — initial: total 850, largest 100. Baseline 747 / 43.
  # 2026-08-26 — total 850 → 1000. Measured 890 / 210 files, largest chunk
  # unchanged at 53 (well under 100, no bump needed there). The persona-panel
  # round-2 batch (issue #328) shipped nine real features in one PR: the 1099
  # e-filing admin workflow, a Day-0 vendor/invoice CSV import UI, three new
  # admin pages (retention policy, access review, privacy/DSAR), the
  # multi-level approval-chain progress stepper, forgot/reset-password pages,
  # clickable column sort across five list views, and bulk operations on
  # vendors/contracts — each adding its own route/component weight. ~14%
  # headroom on the new 890 baseline, matching the original ceiling's headroom
  # over its baseline.
  # 2026-09-05 — total 1000 → 1150. Measured 1046 / 228 files on CI (1042
  # locally); largest chunk 68, still well under 100, so that ceiling is
  # unchanged. Round 22 wired up ten shipped-but-unreachable capabilities —
  # four new routes (/adaptive, /admin/entities, /admin/health, plus the
  # goods-receipts inspections tab) and panels on /organization, /audit and
  # /payments.
  #
  # The growth is overwhelmingly i18n, and the number is worth writing down:
  # the SIX locale catalogues are the six largest chunks in the build at
  # 61-68 KB each — 391 KB, **37% of the counted total**. This round added 324
  # keys per locale (3956 → 4280), i.e. ~1944 translated strings.
  #
  # Note what that means for this metric: a user downloads ONE catalogue, not
  # six, so the counted total overstates what anyone actually fetches by ~325
  # KB. The ceiling still counts all six deliberately (see above) — a lazy
  # chunk is still weight the project ships — but if this ceiling binds again,
  # the honest fix is to make the metric distinguish "shipped" from "fetched
  # per user" rather than to keep ratcheting a number that is 37% duplicated
  # translations. Tracked in docs/followups.md.
  #
  # ~10% headroom on the new 1046 baseline — tighter than the last bump's 14%,
  # because this round's growth is understood and attributable rather than
  # diffuse.
  # 2026-09-15 — the metric changed, so the ceiling was re-derived: total
  # 1150 → 785. The entry above named its own trigger, and it fired: the brand
  # mark (PR #416) measured 1152 on CI against main's 1149, over the ceiling by
  # two new chunks rather than by any real weight. The old total had two
  # distortions:
  #   - It rounded every file up to a whole KB before summing. Across 239 files
  #     that added about 125 KB, and splitting code into more chunks raised the
  #     total with no new weight.
  #   - It counted all five lazy locale catalogues (76-81 KB each), when a
  #     visitor fetches at most one.
  # The total is now summed in bytes, rounded once, and counts every chunk but
  # only the largest catalogue, the most any one visitor downloads. Measured on
  # that branch: 714 KB (1025 KB shipped with every catalogue, 239 files).
  # The largest chunk is 81 KB, the ja catalogue, so that ceiling is unchanged.
  # ~10% headroom on 714, the same margin as the entry above. The four
  # uncounted catalogues are still bounded one by one by MAX_LARGEST_CHUNK_KB,
  # and the locale key-parity test keeps them growing with the counted one.
  # 2026-09-16 — total 785 → 875. The published legal documents (PR #421) took
  # the total to 796 on CI, 11 KB over. The weight is real and it is prose:
  # five complete legal documents — privacy policy, terms, DPA with three
  # annexes, sub-processor register, cookie notice — about 4,300 lines of
  # markup. There is nothing to trim that is not text a reader needs.
  #
  # What makes it cheap in practice, and why the per-chunk ceiling is the one
  # to watch here: SvelteKit route-splits each document into its own node
  # chunk (the DPA is the largest at 24 KB gzipped), so the app shell loads
  # none of them and a visitor who opens one downloads exactly that one. The
  # largest chunk is unchanged at 81 KB — still the ja catalogue, not a legal
  # page — so MAX_LARGEST_CHUNK_KB stays at 100.
  #
  # 875 is ~10% headroom on the new 796 baseline, the same margin the last two
  # entries used. Trigger for the next look: if this binds again from route
  # chunks rather than shared weight, consider whether the total should count
  # the app shell plus the heaviest route instead of every chunk — the same
  # distortion the 2026-09-15 entry corrected for locale catalogues applies to
  # route-split documents nobody loads together.
  # 2026-10-06 — total 875 → 1075. The in-app help centre (PR #516) measured
  # 974 on CI (976 locally) against main's ~850. About 125 KB of growth, and
  # most of it is text nobody downloads unless they open /help:
  #   - guide prose, one lazy chunk at ~67 KB that only /help routes import;
  #   - the eight inline-SVG diagrams, ~14 KB, likewise /help-only;
  #   - ~13 KB of catalogue growth (glossary term names, one-line tooltips
  #     and diagram labels, in every locale), counted once under the
  #     one-catalogue rule;
  #   - the rest is the ⓘ HelpTip component on ~160 call sites and the UI
  #     for the fixes the same PR shipped (clerk entry, payment holds,
  #     discounted payment).
  # The 2026-09-16 entry named its own trigger: "if this binds again from
  # route chunks rather than shared weight, consider whether the total should
  # count the app shell plus the heaviest route". It has fired — ~81 of the
  # 125 KB is route-split help content no other page loads — so the metric
  # change is filed in docs/followups.md rather than ratcheted past silently.
  # ~10% headroom on 976, the same margin as the last three entries.
  #
  # Watch the OTHER ceiling: the largest chunk is now the ja catalogue at
  # 95 KB of MAX_LARGEST_CHUNK_KB's 100. The next few hundred keys will bind
  # it. The durable fix (also filed) is to load the help-only keys as their
  # own lazy catalogue slice, not to raise the per-chunk ceiling.
  # 2026-10-08 — no ceiling change: the durable fix above landed. Goods-receipt
  # entry (PR #535) took the ja catalogue to 101 KB, over the per-chunk 100. The
  # `help.*` keys (all but `help.pageLink` / `help.tip.*`) moved to a second lazy
  # slice per locale, `locales/help/<l>.ts`, loaded by /help and the ⓘ HelpTips
  # (decisions §261). Measured locally on main + the split: largest catalogue
  # 92 KB, largest help slice 10 KB, total 1005 KB of 1075. The total now adds
  # the largest help slice the way it adds the largest catalogue — a visitor
  # downloads at most one of each.
  # 2026-10-20 — no ceiling change: the same fix, taken further. The ja
  # catalogue measured 100 KB on main, at the per-chunk ceiling, and fix PR
  # #611 (five keys) took it to 101 KB. Behind it the ENGLISH chunk — English
  # main is static, so it shares a chunk with the i18n runtime — was ~97 KB,
  # so splitting non-English catalogues alone would have bought two weeks.
  # Two more slices per locale (decisions §300), chosen by measuring gzipped
  # bytes per top-level key namespace in ja and en and keeping the ones a
  # bounded set of routes renders:
  #   - settings: org / orgSso / admin / billing / sweepHealth, 1,023 keys,
  #     ~20% of the catalogue; loaded by /organization, /admin/**, /billing
  #     and /help (whose guides name those controls);
  #   - portal: portal.*, 295 keys, ~5%; loaded by /portal/**.
  # Unlike help, both are lazy in English too (the route awaits them before it
  # renders), which is what takes the English chunk down with the rest.
  # Measured locally on main + the split: largest main catalogue 77 KB (ja),
  # largest chunk 77 KB (the English one), largest settings slice 21 KB,
  # largest portal slice 6 KB, help unchanged at 10 KB; total 1034 KB of 1075
  # (was 1050). With #611 merged on top: largest catalogue 77, largest chunk
  # 78, total 1034. The measurement now counts one file per catalogue kind,
  # derived from the locales/ subdirectories, rather than naming help.
  # 2026-10-21 — the metric changed, so the ceiling was re-derived: total
  # 1075 → 430. The 2026-09-16 entry's trigger ("if this binds again from
  # route chunks rather than shared weight") fired on PR #516, and had been
  # deferred three times since (docs/followups.md). It fired again: PR #636
  # measured 1076 on CI against main's 1035, over the ceiling by ~41 KB of
  # genuine route content. Ratcheting the every-chunk sum again would have
  # charged every visitor for every page, so the gated total is now the app
  # shell plus the heaviest route plus one catalogue of each kind (see above).
  # Measured locally (gzip level 6, no file name in the header, which is why
  # the every-chunk figure reads ~2 KB under the old step's):
  #   main:  gated 391 KB = shell 179 + heaviest route 97 (/help/guides/[id],
  #          the guide prose and diagrams) + catalogues 118 (main 79, help 10,
  #          portal 6, settings 23). Every chunk 1042 (the old step said 1044
  #          locally), shipped 1504, largest chunk 79 (the ja catalogue).
  #   #636:  gated 413 KB = shell 193 + heaviest route 97 (same) + catalogues
  #          123 (it adds a 4 KB marketing slice). Every chunk 1074 (old step:
  #          1076), shipped 1570, largest chunk 83.
  # The help routes are the five heaviest (81-97 KB beyond the shell); the
  # first page of daily work, /invoices, is next at 68, then /organization 51.
  # ~10% headroom on main's 391, the same margin as the earlier entries.
  # MAX_LARGEST_CHUNK_KB is unchanged at 100.
  MAX_TOTAL_KB: 430
  MAX_LARGEST_CHUNK_KB: 100

jobs:
  bundle-budget:
    name: Web bundle budget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build (production)
        working-directory: frontend
        env:
          # Same placeholder CI uses. The value is baked into the bundle at
          # build time but does not affect its size.
          PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

      # The measurement's own tests: a sub-second `node --test`, run here so a
      # broken metric cannot pass the budget it computes.
      - name: Test the measurement
        run: node --test scripts/measure_web_bundle.test.mjs

      # Reads frontend/build, the Vite manifest and SvelteKit's generated route
      # dictionary; MAX_TOTAL_KB and MAX_LARGEST_CHUNK_KB come from `env` above.
      # Locally: `pnpm check:build:bundle` after a production build.
      - name: Measure + assert budget
        run: node scripts/measure_web_bundle.mjs
