name: Web bundle budget

# Hard ceilings on the shipped frontend bundle. The app is adapter-static and
# served from S3 behind CloudFront, so every kilobyte here is downloaded by
# every user on a cold visit — and nothing else in CI notices weight. A PR that pushes
# either metric over its budget fails, so a reviewer has to acknowledge the
# increase instead of it landing unremarked.
#
# This is a ratchet, not a wall: bumping a ceiling is a legitimate outcome when
# the right answer is "ship the feature". The rule is that the bump is
# deliberate and justified IN THIS FILE (see the log under MAX_TOTAL_KB), never
# a casual edit because the job went red.

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/web-bundle-budget.yml'
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Measured 2026-08-06 at the first run of this guard: 747 KB total gzipped
  # across 182 JS+CSS files, largest single chunk 43 KB. Ceilings set with
  # ~14% headroom on the total and deliberately generous headroom on the
  # largest chunk.
  #
  # Why the largest-chunk ceiling is far above the current max: its job is to
  # catch ONE heavyweight dependency landing in ONE chunk (a charting library,
  # a PDF renderer, a second date library), which is the failure mode that
  # actually hurts. This app hand-rolls its charts as CSS bars precisely to
  # avoid that, so the current 43 KB max has room to grow naturally before the
  # gate has anything to say.
  #
  # IMPORTANT: the total counts lazily-imported chunks too. Code-splitting a
  # dependency therefore does NOT lower this number — only removing weight
  # does. The one exception is the lazy locale catalogues: a visitor fetches at
  # most one, so only the largest is counted (see the 2026-09-15 entry). The
  # total is summed in bytes and rounded once, so the number of chunks has no
  # effect on it.
  #
  # ── Ceiling change log — append a dated entry with the measurement + reason ──
  # 2026-08-06 — initial: total 850, largest 100. Baseline 747 / 43.
  # 2026-08-26 — total 850 → 1000. Measured 890 / 210 files, largest chunk
  # unchanged at 53 (well under 100, no bump needed there). The persona-panel
  # round-2 batch (issue #328) shipped nine real features in one PR: the 1099
  # e-filing admin workflow, a Day-0 vendor/invoice CSV import UI, three new
  # admin pages (retention policy, access review, privacy/DSAR), the
  # multi-level approval-chain progress stepper, forgot/reset-password pages,
  # clickable column sort across five list views, and bulk operations on
  # vendors/contracts — each adding its own route/component weight. ~14%
  # headroom on the new 890 baseline, matching the original ceiling's headroom
  # over its baseline.
  # 2026-09-05 — total 1000 → 1150. Measured 1046 / 228 files on CI (1042
  # locally); largest chunk 68, still well under 100, so that ceiling is
  # unchanged. Round 22 wired up ten shipped-but-unreachable capabilities —
  # four new routes (/adaptive, /admin/entities, /admin/health, plus the
  # goods-receipts inspections tab) and panels on /organization, /audit and
  # /payments.
  #
  # The growth is overwhelmingly i18n, and the number is worth writing down:
  # the SIX locale catalogues are the six largest chunks in the build at
  # 61-68 KB each — 391 KB, **37% of the counted total**. This round added 324
  # keys per locale (3956 → 4280), i.e. ~1944 translated strings.
  #
  # Note what that means for this metric: a user downloads ONE catalogue, not
  # six, so the counted total overstates what anyone actually fetches by ~325
  # KB. The ceiling still counts all six deliberately (see above) — a lazy
  # chunk is still weight the project ships — but if this ceiling binds again,
  # the honest fix is to make the metric distinguish "shipped" from "fetched
  # per user" rather than to keep ratcheting a number that is 37% duplicated
  # translations. Tracked in docs/followups.md.
  #
  # ~10% headroom on the new 1046 baseline — tighter than the last bump's 14%,
  # because this round's growth is understood and attributable rather than
  # diffuse.
  # 2026-09-15 — the metric changed, so the ceiling was re-derived: total
  # 1150 → 785. The entry above named its own trigger, and it fired: the brand
  # mark (PR #416) measured 1152 on CI against main's 1149, over the ceiling by
  # two new chunks rather than by any real weight. The old total had two
  # distortions:
  #   - It rounded every file up to a whole KB before summing. Across 239 files
  #     that added about 125 KB, and splitting code into more chunks raised the
  #     total with no new weight.
  #   - It counted all five lazy locale catalogues (76-81 KB each), when a
  #     visitor fetches at most one.
  # The total is now summed in bytes, rounded once, and counts every chunk but
  # only the largest catalogue, the most any one visitor downloads. Measured on
  # that branch: 714 KB (1025 KB shipped with every catalogue, 239 files).
  # The largest chunk is 81 KB, the ja catalogue, so that ceiling is unchanged.
  # ~10% headroom on 714, the same margin as the entry above. The four
  # uncounted catalogues are still bounded one by one by MAX_LARGEST_CHUNK_KB,
  # and the locale key-parity test keeps them growing with the counted one.
  # 2026-09-16 — total 785 → 875. The published legal documents (PR #421) took
  # the total to 796 on CI, 11 KB over. The weight is real and it is prose:
  # five complete legal documents — privacy policy, terms, DPA with three
  # annexes, sub-processor register, cookie notice — about 4,300 lines of
  # markup. There is nothing to trim that is not text a reader needs.
  #
  # What makes it cheap in practice, and why the per-chunk ceiling is the one
  # to watch here: SvelteKit route-splits each document into its own node
  # chunk (the DPA is the largest at 24 KB gzipped), so the app shell loads
  # none of them and a visitor who opens one downloads exactly that one. The
  # largest chunk is unchanged at 81 KB — still the ja catalogue, not a legal
  # page — so MAX_LARGEST_CHUNK_KB stays at 100.
  #
  # 875 is ~10% headroom on the new 796 baseline, the same margin the last two
  # entries used. Trigger for the next look: if this binds again from route
  # chunks rather than shared weight, consider whether the total should count
  # the app shell plus the heaviest route instead of every chunk — the same
  # distortion the 2026-09-15 entry corrected for locale catalogues applies to
  # route-split documents nobody loads together.
  MAX_TOTAL_KB: 875
  MAX_LARGEST_CHUNK_KB: 100

jobs:
  bundle-budget:
    name: Web bundle budget
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Build (production)
        working-directory: frontend
        env:
          # Same placeholder CI uses. The value is baked into the bundle at
          # build time but does not affect its size.
          PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

      - name: Measure + assert budget
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=frontend/build
          # Vite's client manifest maps each hashed chunk back to its source. It
          # is the only reliable way to tell a locale catalogue from any other
          # chunk.
          MANIFEST=frontend/.svelte-kit/output/client/.vite/manifest.json
          if [ ! -d "$BUILD_DIR" ]; then
            echo "::error::No build output at $BUILD_DIR"
            exit 1
          fi
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::No Vite manifest at $MANIFEST. The total needs it to find the lazy locale catalogues; if SvelteKit moved it, update MANIFEST in this step."
            exit 1
          fi

          # The lazily imported locale catalogues (src/lib/i18n/catalogues.ts).
          # English is a static import, so it sits in the entry chunks and is
          # counted like any other code.
          declare -A catalogue=()
          while IFS= read -r file; do
            if [ ! -f "$BUILD_DIR/$file" ]; then
              echo "::error::$MANIFEST names $file, which is not in $BUILD_DIR: the manifest and the build disagree."
              exit 1
            fi
            catalogue["$BUILD_DIR/$file"]=1
          done < <(jq -r 'to_entries[]
            | select(.value.isDynamicEntry == true)
            | select((.value.src // .key) | test("^src/lib/i18n/locales/[^/]+\\.ts$"))
            | .value.file' "$MANIFEST")
          if [ "${#catalogue[@]}" -eq 0 ]; then
            echo "::error::No lazy locale catalogue found in $MANIFEST. If the catalogues moved or stopped being lazy, the one-catalogue rule below no longer describes a visitor; update this step."
            exit 1
          fi

          shipped_bytes=0    # every JS + CSS file the build emits
          counted_bytes=0    # every file except the catalogues...
          catalogue_bytes=0  # ...plus the largest catalogue, added after the loop
          catalogue_path=""
          largest_bytes=0
          largest_path=""
          file_count=0

          while IFS= read -r -d '' f; do
            gz_bytes=$(gzip -c "$f" | wc -c)
            shipped_bytes=$(( shipped_bytes + gz_bytes ))
            file_count=$(( file_count + 1 ))
            if [ "$gz_bytes" -gt "$largest_bytes" ]; then
              largest_bytes="$gz_bytes"
              largest_path="$f"
            fi
            if [ -n "${catalogue[$f]:-}" ]; then
              if [ "$gz_bytes" -gt "$catalogue_bytes" ]; then
                catalogue_bytes="$gz_bytes"
                catalogue_path="$f"
              fi
            else
              counted_bytes=$(( counted_bytes + gz_bytes ))
            fi
          done < <(find "$BUILD_DIR" \( -name '*.js' -o -name '*.css' \) -print0)
          counted_bytes=$(( counted_bytes + catalogue_bytes ))

          # Summed in bytes, rounded up once. Rounding each file up first added
          # up to 1 KB per file, so splitting code into more chunks raised the
          # total without adding any weight.
          kb() { echo $(( ($1 + 1023) / 1024 )); }
          total_kb=$(kb "$counted_bytes")
          shipped_kb=$(kb "$shipped_bytes")
          catalogue_kb=$(kb "$catalogue_bytes")
          largest_kb=$(kb "$largest_bytes")

          echo "Files measured:       ${file_count}, ${#catalogue[@]} of them lazy locale catalogues"
          echo "Total gzipped JS+CSS: ${total_kb} KB (budget ${MAX_TOTAL_KB} KB): every chunk, one catalogue"
          echo "Shipped, not gated:   ${shipped_kb} KB: every chunk, every catalogue"
          echo "Largest catalogue:    ${catalogue_kb} KB — ${catalogue_path}"
          echo "Largest chunk:        ${largest_kb} KB — ${largest_path} (budget ${MAX_LARGEST_CHUNK_KB} KB)"

          {
            echo "## Web bundle budget"
            echo ""
            echo "| Metric | Size | Budget |"
            echo "|---|---|---|"
            echo "| Total gzipped JS+CSS (every chunk, one locale catalogue) | ${total_kb} KB | ${MAX_TOTAL_KB} KB |"
            echo "| Largest single chunk | ${largest_kb} KB | ${MAX_LARGEST_CHUNK_KB} KB |"
            echo "| Shipped (every catalogue) | ${shipped_kb} KB | not gated |"
            echo "| Files measured | ${file_count} (${#catalogue[@]} lazy catalogues) | — |"
            echo ""
            echo "Largest chunk: \`${largest_path#"$BUILD_DIR"/}\`"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          failed=0
          if [ "$total_kb" -gt "$MAX_TOTAL_KB" ]; then
            echo "::error::Total gzipped bundle ${total_kb} KB exceeds the ${MAX_TOTAL_KB} KB budget. Either trim weight, or raise MAX_TOTAL_KB in .github/workflows/web-bundle-budget.yml and append a dated entry to the ceiling change log explaining the measurement and why the growth is warranted."
            failed=1
          fi
          if [ "$largest_kb" -gt "$MAX_LARGEST_CHUNK_KB" ]; then
            echo "::error::Largest chunk ${largest_path#"$BUILD_DIR"/} is ${largest_kb} KB, over the ${MAX_LARGEST_CHUNK_KB} KB per-chunk budget. This usually means a single heavyweight dependency landed in one chunk — check whether it is really needed before raising the ceiling."
            failed=1
          fi
          exit "$failed"
