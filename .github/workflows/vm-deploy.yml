name: Deploy to the VM

# Production deploy for the single-VM stack (docs/minimal-deployment.md,
# docs/decisions.md §254 and §275): a published release runs
# `deploy/deploy.sh --ref <the release's commit>` on the app VM through SSM Run
# Command, waits for it, and fails if the deploy fails.
#
# - No SSH. The VM has no port 22 and no key pair; SSM is the only way in, and
#   every command is an IAM-authorized, CloudTrail-logged event.
# - The role can run ONE thing. `infra/deploy.tf` grants the deploy role
#   `ssm:SendCommand` on the app VM and the `feohledger-vm-deploy` command
#   document only — not AWS-RunShellScript — and that document's single
#   parameter must be a 40-character sha. Holding the role is not a shell.
# - A human approves every run: the job is in the `production` environment,
#   whose required reviewer gates it before any AWS call is made.
# - What deploys is the release's commit, not whatever main is by the time the
#   reviewer approves. deploy.sh refuses a commit that is not on origin/main, so
#   a release tagged on a branch fails instead of shipping unreviewed code.
#
# The SPA (S3 + CloudFront, infra/frontend.tf, docs/decisions.md §278) ships in
# the SAME approved job, after the VM: backend first, so a new UI never calls an
# API that has not shipped. It is built in a separate, ungated job (no AWS, no
# secrets) that runs while the reviewer is still deciding — a second job in the
# `production` environment would pause for a second approval. Publishing is
# armed separately, by FRONTEND_PUBLISH_ENABLED=true, once infra/README.md §
# Frontend on CloudFront is done; until then the build job is skipped, nothing
# is uploaded, and the VM deploy runs exactly as before.
#
# `aws-deploy.yml` is the separate, disarmed pipeline for the ECS build-out
# (docs/production-deployment.md); this one is for the stack that exists.
#
# Armed by the repository variable VM_DEPLOY_ENABLED=true, once the operator
# steps in infra/README.md § Release deploys are done — until then a release
# skips this workflow instead of failing it.

on:
  release:
    types: [published]
  # A redeploy (run it from `main`: main's tip) or a rollback (run it from an
  # older release tag: that tag's commit — only tags that already contain this
  # workflow can be run from). A commit that is not on origin/main is refused
  # on the VM.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One production deploy at a time. Never cancel one in flight: it may be
  # half-way through a migration. (deploy.sh also takes a lock on the VM, which
  # covers a manual run from a Session Manager shell.)
  group: vm-deploy-production
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build the SPA
    runs-on: ubuntu-latest
    # Only when the publish is armed: before that, its required variables may
    # not exist yet, and a failed build here would block the VM deploy.
    if: >-
      vars.VM_DEPLOY_ENABLED == 'true'
      && vars.FRONTEND_PUBLISH_ENABLED == 'true'
      && !(github.event_name == 'release' && github.event.release.prerelease)
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # The same two values deploy.sh bakes into the VM's build. Repository
        # variables, not environment ones: this job is deliberately outside the
        # `production` environment. Neither is secret.
        #
        # PUBLIC_SITE_URL prefixes the absolute og:image URL in src/app.html,
        # which link-preview crawlers need. It is the public site origin, so it
        # is derived from APP_URL rather than kept as a second variable that
        # could disagree with it. An empty APP_URL fails here, because SvelteKit
        # substitutes an empty string for an unset placeholder and would ship a
        # root-relative image URL without complaint. The trailing slash is
        # stripped so the image path can never become `//og-image.png`.
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL is empty — set it as a repository variable (https://feohledger.com); it becomes PUBLIC_SITE_URL."
            exit 1
          fi
          if [ -z "$PUBLIC_API_URL" ]; then
            echo "::error::PUBLIC_API_URL is empty — set it as a repository variable (https://api.feohledger.com)."
            exit 1
          fi
          PUBLIC_SITE_URL="${APP_URL%/}" pnpm build

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          # Outlives the longest the `production` reviewer can leave the deploy
          # job waiting (GitHub expires a pending deployment after 30 days), so
          # the download after the VM step never finds it gone.
          retention-days: 30

  deploy:
    name: Deploy release to the app VM
    runs-on: ubuntu-latest
    # Runs when the SPA built OR was skipped (publish not armed). A failed build
    # stops the deploy before approval: deploy.sh builds the same frontend on
    # the VM, so that commit would fail there too, only later and half-shipped.
    needs: build-frontend
    # Repository variable, not environment-scoped, so it is readable before the
    # environment gate. Prereleases are not production releases.
    if: >-
      !cancelled()
      && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
      && vars.VM_DEPLOY_ENABLED == 'true'
      && !(github.event_name == 'release' && github.event.release.prerelease)
    # deploy.sh builds the frontend and backend on a t4g.medium (~30 min at
    # worst). Worst case on the SSM side is 5 min to deliver + 45 min to run
    # (the document's timeout) = 50; the poll gives up at 55. The SPA publish
    # after it is a few minutes of uploads plus an invalidation CloudFront
    # finishes in well under ten, so the job at 70 leaves room for both.
    timeout-minutes: 70

    # MUST match the deploy role's trust policy (`:environment:production`),
    # and carries the required reviewer.
    environment: production

    permissions:
      id-token: write # OIDC: assume the deploy role, no long-lived keys
      contents: read

    env:
      # The command document infra/deploy.tf creates (output
      # vm_deploy_document_name). Not secret: it is the project name.
      DEPLOY_DOCUMENT: feohledger-vm-deploy
      # On a release, the commit its tag points at; on a manual run, the tip of
      # the branch it was started from.
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run deploy.sh on the VM
        id: send
        env:
          # An environment secret, not a variable: this repo is public and so are
          # its workflow logs, and a secret is masked in them.
          INSTANCE_ID: ${{ secrets.VM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$INSTANCE_ID" ]; then
            echo "::error::The production environment has no VM_INSTANCE_ID secret (infra/README.md § Release deploys)."
            exit 1
          fi
          echo "Deploying ${DEPLOY_SHA}"
          # --timeout-seconds bounds DELIVERY: an offline agent fails in five
          # minutes instead of the default hour. Execution is bounded by the
          # document's own timeout (45 min).
          command_id=$(aws ssm send-command \
            --document-name "$DEPLOY_DOCUMENT" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "Ref=${DEPLOY_SHA}" \
            --timeout-seconds 300 \
            --comment "GitHub run ${GITHUB_RUN_ID}" \
            --query Command.CommandId --output text)
          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"
          echo "SSM command ${command_id}"

      - name: Wait for the deploy
        env:
          INSTANCE_ID: ${{ secrets.VM_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 55 * 60 ))
          status=Pending
          while :; do
            # Right after SendCommand the invocation may not exist yet
            # (InvocationDoesNotExist) — that is "pending". Any other error
            # (a missing permission, say) fails now rather than at the deadline.
            if ! status=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>"$RUNNER_TEMP/poll.err"); then
              grep -q InvocationDoesNotExist "$RUNNER_TEMP/poll.err" || { cat "$RUNNER_TEMP/poll.err" >&2; exit 1; }
              status=Pending
            fi
            case "$status" in
              Pending | InProgress | Delayed | Cancelling) ;;
              *) break ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Still ${status} after 55 minutes. The command may still be running on the VM; its log is under /var/log/feoh-deploy/ (aws ssm start-session)."
              exit 1
            fi
            sleep 20
          done

          # The document returns only the tail of the deploy log; the whole log
          # stays on the VM under /var/log/feoh-deploy/. This run log is PUBLIC
          # (public repo), so tenant database names — which carry customer
          # slugs, printed once per tenant by the migration step — are redacted
          # before printing. And the output is never interpreted as workflow
          # commands: a `::` line in it is printed, not obeyed.
          output() {
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "$1" --output text | grep -v '^None$' || true
          }
          stop=$(openssl rand -hex 16)
          echo "::group::deploy.sh output (tail, tenant names redacted)"
          echo "::stop-commands::${stop}"
          { output StandardOutputContent; output StandardErrorContent; } |
            sed -E 's/feoh_[A-Za-z0-9_]+/feoh_<tenant>/g'
          echo "::${stop}::"
          echo "::endgroup::"

          if [ "$status" != Success ]; then
            echo "::error::Deploy ${status}. A failed build or migration leaves the previous containers serving (deploy/README.md § Deploys)."
            exit 1
          fi
          echo "Deployed ${DEPLOY_SHA}."

      # ── SPA → S3 + CloudFront, now that the backend it calls is live ──────

      - name: Check out the publish scripts
        if: vars.FRONTEND_PUBLISH_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: deploy
          path: src

      - name: Download the build
        if: vars.FRONTEND_PUBLISH_ENABLED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend-build

      # The first session is up to an hour old by now (a slow VM deploy polls
      # for 55 minutes), and the role's default session is one hour. A fresh
      # one keeps the publish from dying on ExpiredToken with the backend
      # already live.
      - name: Refresh AWS credentials (OIDC)
        if: vars.FRONTEND_PUBLISH_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Publish the SPA
        if: vars.FRONTEND_PUBLISH_ENABLED == 'true'
        env:
          # Environment secrets for the same reason as VM_INSTANCE_ID: the
          # bucket name embeds the AWS account id, and these run logs are public.
          FRONTEND_BUCKET: ${{ secrets.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: src/deploy/publish-frontend.sh frontend-build

      - name: Check the edge serves this build
        if: vars.FRONTEND_PUBLISH_ENABLED == 'true'
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          edge=$(aws cloudfront get-distribution --id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --query Distribution.DomainName --output text)
          echo "::add-mask::${edge}"
          origins=("https://${edge}")
          # Before the DNS cutover (infra variable frontend_on_cloudfront) the
          # apex is still the VM's Caddy, serving its own build; after it, the
          # apex and a tenant host must serve this one. CloudFront stamps every
          # response with x-amz-cf-id, so the check follows DNS on its own. (A
          # runner whose resolver still caches the pre-cutover A record sees
          # Caddy and checks the distribution only — the next release covers
          # the apex.) An apex that does not answer at all is an outage either
          # way, so it fails the step rather than reading as "not cut over".
          app=${APP_URL%/}
          if ! headers=$(curl -sSI --max-time 20 "${app}/"); then
            echo "::error::${app} did not answer."
            exit 1
          fi
          if grep -qi '^x-amz-cf-id:' <<<"$headers"; then
            origins+=("${app}" "https://smoke-check.${app#https://}")
          else
            echo "${app} is not on CloudFront yet; checking the distribution only."
          fi
          src/deploy/smoke-frontend.sh frontend-build "${origins[@]}"
