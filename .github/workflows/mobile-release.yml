name: Mobile Release

# Builds the Flutter mobile artifacts (Android APK, iOS .app) on a `mobile-v*`
# tag, or by hand from the Actions tab. Both jobs reference the `production`
# GitHub Environment, so its required reviewer approves before either build runs.
#
# Deliberately NOT on `release: published`: a web release deploys the VM
# (vm-deploy.yml), and the mobile app ships on its own cadence through the app
# stores. Triggering here on every web release queued a second approval for
# artifacts nobody ships — the APK is not release-signed and the iOS build is
# `--no-codesign`, so neither can go to a store yet (store accounts, signing and
# listings are operator work, docs/production-deployment.md § Mobile).
#
# The web frontend is NOT built here — it deploys to S3 + CloudFront via
# aws-deploy.yml. (The old GitHub Pages deploy that lived in this file has
# been retired now that AWS is the production frontend.)

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    # Approver-gated by the production environment, same as the AWS deploys.
    environment:
      name: production

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.1
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.0
        with:
          name: android-apk-${{ github.ref_name }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  mobile-ios:
    name: Build iOS
    runs-on: macos-latest

    environment:
      name: production

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.1
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
