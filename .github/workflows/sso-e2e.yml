# Dedicated SSO end-to-end workflow (OIDC + SAML).
#
# SSO is also exercised by the broader `service-e2e` job in `ci.yml` (bundled
# with email / LocalStack / stripe-mock). This workflow is the focused,
# fast-feedback counterpart: it boots ONLY Keycloak, seeds SSO on the acme
# tenant, and drives the real OIDC handshake (`frontend/tests-e2e/sso/`) and
# then the real SAML handshake (`frontend/tests-e2e/saml/`) through the browser.
# It gives a single, isolated green/red signal for "can a user sign in via SSO"
# without waiting on the 25-minute four-service bundle.
#
# Triggers: push / PR to main that touch the SSO surface (backend SSO routes +
# service, the Keycloak realm + seed script, the login routes, the SSO specs),
# plus manual dispatch. No schedule by design — SSO is re-verified when the
# code or IdP config that affects it changes.
name: SSO e2e

on:
  push:
    branches: [main]
    paths: &sso-paths
      - "backend/app/api/auth_sso.py"
      - "backend/app/api/auth_saml.py"
      - "backend/app/services/sso.py"
      - "backend/keycloak/realm-export.json"
      - "backend/scripts/enable_keycloak_sso.py"
      - "backend/scripts/enable_keycloak_saml.py"
      - "backend/docker-compose.yml"
      - "frontend/src/routes/login/**"
      - "frontend/tests-e2e/sso/**"
      - "frontend/tests-e2e/saml/**"
      - "frontend/tests-e2e/fixtures/**"
      - ".github/workflows/sso-e2e.yml"
  pull_request:
    branches: [main]
    paths: *sso-paths
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: sso-e2e-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo to check out, build, and
# run the SSO e2e suite — it never writes back. The failure-path
# upload-artifact step works under `contents: read` plus its own ephemeral
# artifact storage. Mirrors the top-level scope in ci.yml.
permissions:
  contents: read

jobs:
  sso-e2e:
    name: SSO e2e (Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # same ref as backend/docker-compose.yml — no Dependabot ecosystem reads this line; bump both
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feohledger
          PGDATA: /dev/shm/pgdata
        ports:
          - 5432:5432
        options: >-
          --shm-size=2g
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        # same ref as backend/docker-compose.yml — no Dependabot ecosystem reads this line; bump both
        image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      FEOH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/feohledger
      FEOH_REDIS_URL: redis://localhost:6379
      FEOH_SECRET_KEY: ci-test-secret
      FEOH_DEBUG: "true"
      FEOH_PUBLIC_URL: http://localhost:7777
      FEOH_TENANT_URL_TEMPLATE: "http://{slug}.localhost:7777"
      FEOH_RATE_LIMIT_ENABLED: "false"
      FEOH_MAX_CONCURRENT_SESSIONS: "100"
      FEOH_E2E_TENANT_COUNT: "1"
      FEOH_E2E_USE_PREVIEW: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend + frontend deps (parallel)
        # Backend deps install from the hash-pinned lock (`--require-hashes`,
        # pip itself included) so every dependency is pinned by hash — see the
        # Backend job's Install step in ci.yml for the rationale. This also
        # satisfies Scorecard's PinnedDependenciesID, which flags any bare
        # `pip install`.
        run: |
          set -euo pipefail
          (cd backend && python -m pip install --require-hashes -r requirements-dev.lock && pip install -e . --no-deps) &
          PIP_PID=$!
          (cd frontend && pnpm install --frozen-lockfile) &
          PNPM_PID=$!
          wait $PIP_PID || { echo "::error::backend pip install failed"; exit 1; }
          wait $PNPM_PID || { echo "::error::frontend pnpm install failed"; exit 1; }

      - name: Start Keycloak
        working-directory: backend
        # Only Keycloak from the `idp` profile — not Authentik (SCIM, not needed
        # here) and not the compose core Postgres/Redis, which would collide with
        # the GitHub `services:` above.
        run: docker compose --profile idp up -d keycloak

      - name: Wait for Keycloak
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            curl -fsS "http://localhost:8088/realms/feohledger/.well-known/openid-configuration" >/dev/null 2>&1 \
              && { echo "keycloak up"; exit 0; }
            sleep 2
          done
          echo "::error::keycloak not ready"; exit 1

      - name: Seed database (lean)
        working-directory: backend
        run: python scripts/seed.py --lean

      - name: Enable Keycloak SSO on the acme tenant
        working-directory: backend
        run: python scripts/enable_keycloak_sso.py

      - name: Start backend in background
        working-directory: backend
        run: |
          nohup python main.py > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not respond on /api/health within 30s"
          tail -100 /tmp/backend.log || true
          exit 1

      - name: Build frontend
        working-directory: frontend
        env:
          PUBLIC_API_URL: http://localhost:8000
          # Mirrors ci.yml's e2e build — see that job for why.
          PUBLIC_PLATFORM_DOMAINS: localhost
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install chromium

      # Split out of the step above, which used to be `install --with-deps`.
      # On this runner image every Chromium shared library (libnss3, libgbm1,
      # libatk, libcups2, xvfb, ...) is already the newest version, so the apt
      # step adds nothing but 9 font packages (CJK / Cyrillic / Thai / bitmap).
      # No spec makes a visual assertion -- `screenshot: 'only-on-failure'` in
      # tests-e2e/playwright.config.ts is a debug artifact, and nothing calls
      # toHaveScreenshot/toMatchSnapshot -- so a missing font cannot change a
      # result. It only means non-Latin glyphs render as tofu in a failure
      # screenshot, which is why this stays best-effort instead of being
      # dropped outright.
      #
      # Bounded and non-blocking because `playwright install-deps` shells out to
      # `apt-get update`, which reaches external Ubuntu mirrors: on 2026-08-18 it
      # hung there for 22 minutes and ate the entire 25-minute Service e2e job
      # budget (PR #316). A cosmetic dependency must not be able to fail the run.
      - name: Install Playwright font deps (best-effort)
        working-directory: frontend
        timeout-minutes: 3
        continue-on-error: true
        run: pnpm exec playwright install-deps chromium

      - name: Run SSO e2e specs
        working-directory: frontend
        env:
          PUBLIC_API_URL: http://localhost:8000
          PLAYWRIGHT_WORKERS: "1"
        run: pnpm exec playwright test --config=tests-e2e/playwright.config.ts sso/

      # SAML reuses the SAME Keycloak + acme tenant. Seeding SAML rewrites acme's
      # settings.sso (protocol=saml), replacing the OIDC block — the backend
      # reads it live per-request, so no restart is needed. Run the OIDC specs
      # first (above), then flip acme to SAML and run the SAML specs.
      - name: Enable Keycloak SAML on the acme tenant
        working-directory: backend
        run: python scripts/enable_keycloak_saml.py

      - name: Run SAML e2e specs
        working-directory: frontend
        env:
          PUBLIC_API_URL: http://localhost:8000
          PLAYWRIGHT_WORKERS: "1"
          # Keycloak is up on purpose here — an unreachable IdP is a hard fail,
          # never a silent skip that would drop SAML coverage.
          FEOH_REQUIRE_INTEGRATION: "1"
        run: pnpm exec playwright test --config=tests-e2e/playwright.config.ts saml/

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: playwright-report-sso-e2e
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Upload backend + Keycloak logs on failure
        if: failure()
        run: |
          echo "===== backend.log =====" && tail -200 /tmp/backend.log || true
          cd backend && docker compose logs keycloak || true
